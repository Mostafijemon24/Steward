# clamd for Steward (mounted read-only into the clamav container).
# Reached only over the internal "scan" network by the API containers (INSTREAM on TCP 3310).
Foreground yes
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
SelfCheck 600

# Uploads are at most 25 MiB (MAX_UPLOAD_BYTES); allow a margin. A larger stream is answered
# with an error, and the API then refuses the upload (fail closed).
StreamMaxLength 32M
MaxScanSize 120M
MaxFileSize 32M
MaxRecursion 12
MaxFiles 5000

# Never answer "OK" for content that could not be fully scanned: report it as FOUND instead,
# so the API quarantines it (Office files are zip archives; encrypted ones can't be inspected).
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
