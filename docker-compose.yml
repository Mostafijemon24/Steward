# Steward — development and single-VPS deployment.
#   docker compose up -d --build                 # app on http://localhost:3000
#   docker compose --profile tls up -d --build   # + Caddy with automatic HTTPS for $DOMAIN
# Only the web app (or Caddy) publishes a port. PostgreSQL, the API and the workers stay on an
# internal network with no route to the internet. Only the orchestrator (model calls) and the tools
# worker (allowlisted web reads) are also attached to the "egress" network.
name: steward

x-api-env: &api-env
  ENV: ${APP_ENV:?set APP_ENV to development or production}
  APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?set APPROVAL_SIGNING_KEY (openssl rand -base64 48)}
  DATABASE_URL: postgresql+psycopg://steward_app:${STEWARD_APP_PASSWORD:?set STEWARD_APP_PASSWORD}@db:5432/steward
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  # true ONLY with the Caddy "tls" profile, which sets X-Real-IP. Without Caddy every
  # request shares the web container address (per-IP limits then act site-wide).
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  STORAGE_DIR: /data/storage
  MAIL_BACKEND: ${MAIL_BACKEND:-outbox}
  MAIL_OUTBOX_DIR: /data/mail-outbox
  MAIL_FROM: ${MAIL_FROM:-Steward <no-reply@localhost>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  DELETION_RETENTION_DAYS: ${DELETION_RETENTION_DAYS:-30}
  # Malware scanning: "clamav" needs the `scan` profile (clamd); uploads are refused if it is down.
  MALWARE_SCANNER: ${MALWARE_SCANNER:-none}
  CLAMAV_HOST: clamav

# Model provider: read by the API (to describe it) and the orchestrator/tools workers (to call it).
# The key never reaches the browser, the model, logs or task output.
x-model-env: &model-env
  MODEL_PROVIDER: ${MODEL_PROVIDER:-none}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  MODEL_LOCATION: ${MODEL_LOCATION:-external}
  MODEL_PROVIDER_LABEL: ${MODEL_PROVIDER_LABEL:-}
  MONTHLY_MODEL_TOKEN_QUOTA: ${MONTHLY_MODEL_TOKEN_QUOTA:-2000000}

# Bounded logs on every service (docker json-file rotation): 5 × 10 MB per container.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

# Workers serve no HTTP: healthy = this container's worker row heart-beat within the last minute.
x-worker-health: &worker-health
  test: ["CMD", "python", "-m", "app.workers.health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-worker-env: &worker-env
  ENV: ${APP_ENV}
  PROCESS_ROLE: worker
  APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  STORAGE_DIR: /data/storage
  MAIL_BACKEND: disabled
  DELETION_RETENTION_DAYS: ${DELETION_RETENTION_DAYS:-30}
  # Workers connect only with their own least-privileged role (DATABASE_URL is set to the same role).
  WORKER_DATABASE_URL: postgresql+psycopg://steward_worker:${STEWARD_WORKER_PASSWORD:?set STEWARD_WORKER_PASSWORD}@db:5432/steward
  DATABASE_URL: postgresql+psycopg://steward_worker:${STEWARD_WORKER_PASSWORD}@db:5432/steward

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      STEWARD_OWNER_PASSWORD: ${STEWARD_OWNER_PASSWORD:?set STEWARD_OWNER_PASSWORD}
      STEWARD_APP_PASSWORD: ${STEWARD_APP_PASSWORD:?set STEWARD_APP_PASSWORD}
      STEWARD_WORKER_PASSWORD: ${STEWARD_WORKER_PASSWORD:?set STEWARD_WORKER_PASSWORD}
      STEWARD_DELETER_PASSWORD: ${STEWARD_DELETER_PASSWORD:?set STEWARD_DELETER_PASSWORD}
      STEWARD_READONLY_PASSWORD: ${STEWARD_READONLY_PASSWORD:?set STEWARD_READONLY_PASSWORD}
    networks: [backend]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steward"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No "ports:" — the database is never exposed outside the Docker network.

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://steward_owner:${STEWARD_OWNER_PASSWORD}@db:5432/steward
      PROCESS_ROLE: migrate  # no HTTP, no encryption keys
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Two identical API containers behind Caddy: one can restart while the other serves
  # (deploy/rolling-restart.sh). Rate limits, sessions and the queue live in PostgreSQL.
  api: &api-service
    build: ./api
    restart: unless-stopped
    logging: *logging
    environment:
      <<: [*api-env, *model-env]
      MODEL_API_KEY: ""  # the API only describes the provider; it never calls it
      # Bearer token for /metrics (internal network only; Caddy never serves it). Empty = disabled.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Per container: keep containers * API_PROCESSES * (DB_POOL_SIZE + DB_MAX_OVERFLOW) well below
      # Postgres max_connections (100) minus workers and maintenance (see docs/PERFORMANCE.md).
      API_PROCESSES: ${API_PROCESSES:-1}
      API_MAX_CONCURRENCY: ${API_MAX_CONCURRENCY:-80}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      # MFA seeds (AES-256-GCM): only the API containers hold this key.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY (python -m app.core.crypto keygen)}
      # Integration credentials are sealed to this public key; the API can encrypt but never decrypt.
      INTEGRATION_SECRETS_PUBLIC_KEY: ${INTEGRATION_SECRETS_PUBLIC_KEY:?set INTEGRATION_SECRETS_PUBLIC_KEY (python -m app.core.crypto keygen)}
    <<: *hardening
    # uvicorn finishes in-flight requests for up to 25 s on SIGTERM; give it that time.
    stop_grace_period: 30s
    networks: [backend, apinet, scan]
    volumes:
      - storage:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-2: *api-service

  # ---- agent engine workers (same image, separate processes and database roles)
  orchestrator:
    build: ./api
    command: ["python", "-m", "app.workers", "orchestrator"]
    restart: unless-stopped
    # Several orchestrators share the queue safely (jobs are claimed with SKIP LOCKED).
    deploy:
      replicas: ${ORCHESTRATOR_REPLICAS:-2}
    logging: *logging
    healthcheck: *worker-health
    environment:
      <<: [*worker-env, *model-env]
    <<: *hardening
    networks: [backend, egress]  # egress only for the configured model endpoint
    depends_on:
      migrate:
        condition: service_completed_successfully

  tools:
    build: ./api
    command: ["python", "-m", "app.workers", "tools"]
    restart: unless-stopped
    logging: *logging
    healthcheck: *worker-health
    environment:
      <<: [*worker-env, *model-env]
      # Code execution needs Linux user namespaces, which Docker's default seccomp profile blocks.
      # It then reports itself unavailable and code steps are blocked (fails closed). Do not
      # disable seccomp to enable it; use gVisor (runtime: runsc) or a dedicated sandbox host.
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      # Only the tools worker can decrypt integration credentials (WordPress drafts).
      INTEGRATION_SECRETS_PRIVATE_KEY: ${INTEGRATION_SECRETS_PRIVATE_KEY:?set INTEGRATION_SECRETS_PRIVATE_KEY (python -m app.core.crypto keygen)}
    <<: *hardening
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks: [backend, egress]  # allowlisted web reads (checked again by the egress client)
    volumes:
      - storage:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  deletion:
    build: ./api
    command: ["python", "-m", "app.workers", "deletion"]
    restart: unless-stopped
    logging: *logging
    healthcheck: *worker-health
    environment:
      <<: *worker-env
      DELETION_DATABASE_URL: postgresql+psycopg://steward_deleter:${STEWARD_DELETER_PASSWORD}@db:5432/steward
      DATABASE_URL: postgresql+psycopg://steward_deleter:${STEWARD_DELETER_PASSWORD}@db:5432/steward
      WORKER_DATABASE_URL: ""
    <<: *hardening
    networks: [backend]  # no internet
    volumes:
      - storage:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: ./api
    command: ["python", "-m", "app.workers", "scheduler"]
    restart: unless-stopped
    logging: *logging
    healthcheck: *worker-health
    environment: *worker-env
    <<: *hardening
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    logging: *logging
    networks: [backend, edge]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    networks: [edge, apinet]  # apinet: Caddy → API containers only (no route to db or workers)
    # Runs as root inside the container only to bind 80/443; every other capability is dropped.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # TLS certificates and ACME account (back up or let Caddy re-issue)
      - caddy-config:/config
    depends_on:
      - web

  # Optional malware scanning (profile "scan"; set MALWARE_SCANNER=clamav). clamd parses untrusted
  # uploads, so it is isolated: only the API containers can reach it (internal "scan" network), it
  # has no internet access, a read-only filesystem and only the capabilities it needs to drop to its
  # own user. Signature updates run in a separate freshclam container (the only one on egress).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    # Run clamd directly (not the image's /init, which chowns the volume as root and fails once
    # clamd has created its private temp folders there). clamd drops to the clamav user itself.
    entrypoint: ["clamd", "--foreground=yes"]
    init: true
    restart: unless-stopped        # restarts until freshclam has downloaded the first signatures
    logging: *logging
    networks: [scan]
    volumes:
      - clamav-db:/var/lib/clamav
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    read_only: true
    # /run/clamav pre-created for the clamav user (uid 100) so no extra capability is needed.
    tmpfs: ["/tmp", "/run/clamav:uid=100,gid=101,mode=775"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]  # only to drop from root to the clamav user
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s  # the first signature download takes several minutes

  freshclam:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    entrypoint: ["freshclam", "--daemon", "--foreground=yes"]
    init: true
    restart: unless-stopped
    logging: *logging
    networks: [egress]
    volumes:
      - clamav-db:/var/lib/clamav
      - ./deploy/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    read_only: true
    tmpfs: ["/tmp", "/run/clamav:uid=100,gid=101,mode=775"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

networks:
  backend:
    internal: true  # no route to the internet
  apinet:
    internal: true  # Caddy ↔ API containers only
  scan:
    internal: true  # API containers ↔ clamd only
  edge: {}
  egress: {}

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
  clamav-db:
